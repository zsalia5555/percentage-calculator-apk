
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: percentage-calculator-apk/percentage-calculator-apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Generate Zamir Calculator app icon
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cp resources/icon.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: percentage-calculator-apk/percentage-calculator-apk/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Percentage-Calculator-Android-APK
          path: percentage-calculator-apk/percentage-calculator-apk/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
